title: "[Show and tell] "
body:
  - type: markdown
    attributes:
      value: |
        Share how you are using Reference Field Operational Memory with ChatGPT, what you changed, or what you learned. Please keep examples sanitized.
  - type: textarea
    id: use_case
    attributes:
      label: What are you using it for?
      placeholder: I use one private copy for several ongoing research projects...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface are you using?
      options:
        - ChatGPT Chat
        - ChatGPT Work
        - Codex
        - More than one
        - Other / not sure
    validations:
      required: false
  - type: textarea
    id: worked
    attributes:
      label: What worked particularly well?
      placeholder: Fresh chats recovered the right project without loading unrelated work...
    validations:
      required: false
  - type: textarea
    id: surprised
    attributes:
      label: What surprised you or still feels awkward?
      placeholder: Activation was easy, but I was not sure whether a preference had been persisted...
    validations:
      required: false
